<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05060b">
<title>Flower Garden — 流線の花畑</title>
<meta name="description" content="3D 版 ver.3 の流線を上から見た姿だけを使い、パラメータを少しずつ変えた花を大・中・小ランダムに画面いっぱいに並べて動かす。">
<style>
:root { --bg: #05060b; --fg: #e8ecf6; --muted: #8d93a6; --bar: rgba(16, 18, 28, .72); --line: rgba(255, 255, 255, .14); --accent: #f07aa8; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;
  font: 14px/1.5 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: manipulation; }
#bar {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(12px + env(safe-area-inset-bottom)); max-width: calc(100vw - 24px);
  display: flex; gap: 6px; align-items: center; padding: 6px; border-radius: 999px;
  background: var(--bar); border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  transition: opacity .4s;
}
#bar.idle { opacity: 0; pointer-events: none; }
#bar button, #bar select, #bar a {
  font: inherit; font-size: 13px; color: var(--fg); background: transparent; border: 0; border-radius: 999px;
  padding: 7px 12px; cursor: pointer; white-space: nowrap; text-decoration: none;
}
#bar select { appearance: none; -webkit-appearance: none; background: rgba(255,255,255,.06); }
#bar select option { background: #15141c; }
#bar button.primary { background: var(--accent); color: #fff; }
#status { position: fixed; left: 12px; top: calc(8px + env(safe-area-inset-top)); font: 11px ui-monospace, Menlo, monospace;
  color: var(--muted); pointer-events: none; transition: opacity .6s; }
#nogl { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: #ccc; }
</style>
</head>
<body>
<canvas id="gl" aria-label="流線で描いた対称カオス写像の花が、大きさを変えて画面いっぱいに並ぶ"></canvas>
<div id="status"></div>
<div id="nogl" hidden>この環境では WebGL2 が使えません。</div>
<div id="bar">
  <a href="3d-v3.html" title="3D 版 ver.3 へ">←</a>
  <button id="regen" class="primary">咲き直す</button>
  <select id="palette" aria-label="色">
    <option value="night">夜光</option>
    <option value="gold">金糸</option>
    <option value="mix">色とりどり</option>
  </select>
  <select id="vary" aria-label="ゆらぎ">
    <option value="0.25">ゆらぎ 小</option>
    <option value="0.55" selected>ゆらぎ 中</option>
    <option value="1">ゆらぎ 大</option>
  </select>
  <button id="save">PNG</button>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const canvas = $("gl"), statusEl = $("status");
  const gl = canvas.getContext("webgl2", { antialias: true, premultipliedAlpha: false, preserveDrawingBuffer: false });
  if (!gl || typeof Worker === "undefined") { $("nogl").hidden = false; $("bar").hidden = true; return; }

  // 元にする形：3D 版 ver.3 のプリセット「菊 — Chrysanthemum」
  const BASE = { n: 12, lam: -2.661, alpha: 3.61, beta: 0.31, gamma: -0.437, omega: 0, kap: -0.226, mu: 0.6, del: -0.138, eps: 0.289 };
  // 流線の設定（ver.3 の初期値）
  const FLOW = { phi: 82, thr: 0.45, minSize: 0.16 };
  const VB = 1.08, VW = 1.25;
  const coarse = matchMedia("(pointer: coarse)").matches;

  // ==================================================================================
  // Worker：パラメータを揺らして良い形を探し → 密度ボリューム → 流線
  // （3d-v3.html と同じ計算。表示は上から見た xy だけを使う）
  // ==================================================================================
  function flowerWorker() {
    let NX = 0, NY = 0, NW = 0;
    function step(q, x, y, w) {
      const zz = x * x + y * y;
      let zr = x, zi = y;
      for (let i = 1; i < q.n - 1; i++) { const t = zr * x - zi * y; zi = zr * y + zi * x; zr = t; }
      const ren = zr * x - zi * y;
      const r = Math.sqrt(zz), cosn = r > 1e-12 ? ren / Math.pow(r, q.n) : 0;
      const p = q.lam + q.kap * w + q.alpha * zz + q.beta * ren;
      NX = p * x - q.omega * y + q.gamma * zr;
      NY = p * y + q.omega * x - q.gamma * zi;
      NW = q.mu * w + q.del * r * cosn + q.eps * zz;
    }
    const ok = (x, y, w) => Math.abs(x) + Math.abs(y) + Math.abs(w) < 1e4;

    function probe(q, N = 20000) {
      let x = 0.01, y = 0.003, w = 0, R = 0;
      for (let i = 0; i < N; i++) {
        step(q, x, y, w); x = NX; y = NY; w = NW;
        if (!ok(x, y, w)) return null;
        if (i > 2000) { const r = x * x + y * y; if (r > R) R = r; }
      }
      R = Math.sqrt(R);
      return R > 1e-6 ? { R, x, y, w } : null;
    }
    // 箱数え次元・高さの幅・広がり・Lyapunov 指数で、点・閉曲線・塗りつぶし・周期軌道を除外
    function quality(q, pr) {
      const cells = new Set(), cells2 = new Set(), xy = new Set();
      let x = pr.x, y = pr.y, w = pr.w, wmin = Infinity, wmax = -Infinity;
      const pts = [];
      for (let i = 0; i < 30000; i++) {
        step(q, x, y, w); x = NX; y = NY; w = NW;
        if (!ok(x, y, w)) return null;
        pts.push(x, y, w); if (w < wmin) wmin = w; if (w > wmax) wmax = w;
      }
      const wr = Math.max(wmax - wmin, 1e-9);
      for (let i = 0; i < pts.length; i += 3) {
        const a = Math.min(1, Math.max(0, (pts[i] / pr.R + 1) / 2)), b = Math.min(1, Math.max(0, (pts[i + 1] / pr.R + 1) / 2)), c = (pts[i + 2] - wmin) / wr;
        xy.add(((a * 31) | 0) * 32 + ((b * 31) | 0));
        cells.add(((a * 31) | 0) * 4096 + ((b * 31) | 0) * 64 + ((c * 31) | 0));
        cells2.add(((a * 63) | 0) * 65536 + ((b * 63) | 0) * 256 + ((c * 63) | 0));
      }
      const d0 = 1e-8; let x2 = x + d0, y2 = y, w2 = w, lsum = 0;
      for (let i = 0; i < 1500; i++) {
        step(q, x, y, w); const ax = NX, ay = NY, aw = NW;
        step(q, x2, y2, w2);
        const dx = NX - ax, dy = NY - ay, dw = NW - aw, dd = Math.hypot(dx, dy, dw) || 1e-300;
        lsum += Math.log(dd / d0);
        x = ax; y = ay; w = aw; x2 = ax + dx * d0 / dd; y2 = ay + dy * d0 / dd; w2 = aw + dw * d0 / dd;
      }
      return { D: Math.log2(cells2.size / cells.size), wr: wr / pr.R, n2: cells.size,
               xy: xy.size / (Math.PI * 16 * 16), lyap: lsum / 1500 };
    }
    const good = s => s && s.D > 1.3 && s.D < 2.5 && s.wr > 0.1 && s.n2 > 400 && s.xy > 0.12 && s.lyap > 0.02;

    const rnd = (lo, hi) => lo + Math.random() * (hi - lo);
    function vary(base, v) {
      const g = () => (Math.random() + Math.random() + Math.random() - 1.5) * 2 * v;   // おおよそ ±v の山形
      const c = { ...base,
        lam: base.lam + g() * 0.5, alpha: base.alpha + g() * 1.0, beta: base.beta + g() * 0.5,
        gamma: base.gamma + g() * 0.45, kap: base.kap + g() * 0.12, mu: Math.min(0.92, Math.max(0.15, base.mu + g() * 0.18)),
        del: base.del + g() * 0.45, eps: base.eps + g() * 0.25 };
      if (Math.random() < v * 0.7) c.n = 5 + Math.floor(Math.random() * 10);           // 対称の数も時々変える
      if (Math.random() < v * 0.2) c.omega = rnd(-0.15, 0.15);                        // まれに鏡映を破る
      return c;
    }
    function search(base, v, exact) {
      if (exact) { const pr = probe(base); if (pr) return base; }
      for (let t = 0; t < 400; t++) {
        const c = vary(base, v * (1 + t / 200));
        const pr = probe(c);
        if (!pr) continue;
        if (good(quality(c, pr))) return c;
      }
      return base;
    }

    function blur(a, res) {
      const k = [Math.exp(-2), Math.exp(-0.5), 1, Math.exp(-0.5), Math.exp(-2)];
      const ks = k.reduce((s, v) => s + v, 0); for (let i = 0; i < 5; i++) k[i] /= ks;
      let src = a, dst = new Float32Array(a.length);
      for (const stride of [1, res, res * res]) {
        for (let z = 0; z < res; z++) for (let y = 0; y < res; y++) {
          const base = (z * res + y) * res;
          for (let x = 0; x < res; x++) {
            const i = base + x, c = stride === 1 ? x : stride === res ? y : z;
            let s = 0;
            for (let o = -2; o <= 2; o++) { const cc = c + o; if (cc >= 0 && cc < res) s += k[o + 2] * src[i + o * stride]; }
            dst[i] = s;
          }
        }
        [src, dst] = [dst, src];
      }
      return src;
    }

    function volume(q, res, total) {
      let x = 0.01, y = 0.003, w = 0, R = 0;
      for (let i = 0; i < 20000; i++) {
        step(q, x, y, w); x = NX; y = NY; w = NW;
        if (!ok(x, y, w)) return null;
        if (i > 2000) R = Math.max(R, x * x + y * y);
      }
      R = Math.sqrt(R);
      if (!(R > 1e-6)) return null;
      const samp = new Float64Array(20000);
      for (let i = 0; i < samp.length; i++) { step(q, x, y, w); x = NX; y = NY; w = NW; samp[i] = w; }
      samp.sort();
      const lo = samp[200], hi = samp[19800], mid = (lo + hi) / 2, half = Math.max((hi - lo) / 2, 1e-6);
      const mirror = Math.abs(q.omega) < 1e-9, reps = q.n * (mirror ? 2 : 1);
      const C = [], S = [];
      for (let k = 0; k < q.n; k++) { C.push(Math.cos(2 * Math.PI * k / q.n)); S.push(Math.sin(2 * Math.PI * k / q.n)); }
      const N = Math.ceil(total / reps);
      const vol = new Float32Array(res * res * res), r2 = res * res;
      const sxy = res / (2 * VB), sw = res / (2 * VW);
      function splat(px, py, fz, iz, wz) {
        const fx = (px + VB) * sxy - 0.5, fy = (py + VB) * sxy - 0.5;
        const ix = Math.floor(fx), iy = Math.floor(fy);
        if (ix < 0 || iy < 0 || ix >= res - 1 || iy >= res - 1) return;
        const ax = fx - ix, ay = fy - iy, i0 = iz * r2 + iy * res + ix, i1 = i0 + r2;
        const w00 = (1 - ax) * (1 - ay), w10 = ax * (1 - ay), w01 = (1 - ax) * ay, w11 = ax * ay, bz = 1 - wz;
        vol[i0] += w00 * bz; vol[i0 + 1] += w10 * bz; vol[i0 + res] += w01 * bz; vol[i0 + res + 1] += w11 * bz;
        vol[i1] += w00 * wz; vol[i1 + 1] += w10 * wz; vol[i1 + res] += w01 * wz; vol[i1 + res + 1] += w11 * wz;
      }
      for (let i = 0; i < N; i++) {
        step(q, x, y, w); x = NX; y = NY; w = NW;
        if (!ok(x, y, w)) break;
        const fz = ((w - mid) / half + VW) * sw - 0.5, iz = Math.floor(fz);
        if (iz < 0 || iz >= res - 1) continue;
        const wz = fz - iz, X = x / R, Y = y / R;
        for (let k = 0; k < q.n; k++) {
          const c = C[k], s = S[k];
          splat(c * X - s * Y, s * X + c * Y, fz, iz, wz);
          if (mirror) splat(c * X + s * Y, s * X - c * Y, fz, iz, wz);
        }
      }
      for (let i = 0; i < vol.length; i++) vol[i] = Math.log1p(vol[i]);
      const out = blur(vol, res);
      let mx = 0; for (let i = 0; i < out.length; i++) if (out[i] > mx) mx = out[i];
      const vals = [], strideS = Math.max(1, Math.floor(out.length / 400000));
      for (let i = 0; i < out.length; i += strideS) if (out[i] > mx * 0.02) vals.push(out[i]);
      vals.sort((a, b) => a - b);
      const p = vals.length ? vals[Math.floor(vals.length * 0.995)] : 1, sc = 1 / (p || 1);
      for (let i = 0; i < out.length; i++) out[i] *= sc;
      const quant = [];
      for (let i = 0; i <= 100; i++) quant.push(vals.length ? vals[Math.min(vals.length - 1, Math.floor(vals.length * i / 100))] * sc : i / 100);
      return { res, vol: blur(blur(out, res), res), quant, n: q.n, mirror };
    }

    // v = ∇ρ × (cosφ e_θ + sinφ e_z) を積分した、等値面の上を走る線
    function makeLines(st, L) {
      const { res, vol, quant, n, mirror } = st;
      const r2 = res * res, sxy = res / (2 * VB), sw = res / (2 * VW);
      const sample = (x, y, z) => {
        const fx = (x + VB) * sxy - 0.5, fy = (y + VB) * sxy - 0.5, fz = (z + VW) * sw - 0.5;
        const ix = Math.floor(fx), iy = Math.floor(fy), iz = Math.floor(fz);
        if (ix < 0 || iy < 0 || iz < 0 || ix >= res - 1 || iy >= res - 1 || iz >= res - 1) return 0;
        const ax = fx - ix, ay = fy - iy, az = fz - iz, i = iz * r2 + iy * res + ix;
        const c00 = vol[i] + (vol[i + 1] - vol[i]) * ax, c10 = vol[i + res] + (vol[i + res + 1] - vol[i + res]) * ax;
        const c01 = vol[i + r2] + (vol[i + r2 + 1] - vol[i + r2]) * ax, c11 = vol[i + r2 + res] + (vol[i + r2 + res + 1] - vol[i + r2 + res]) * ax;
        const c0 = c00 + (c10 - c00) * ay, c1 = c01 + (c11 - c01) * ay;
        return c0 + (c1 - c0) * az;
      };
      const ex = 2 * VB / res, ez = 2 * VW / res;
      const cphi = Math.cos(L.phi * Math.PI / 180), sphi = Math.sin(L.phi * Math.PI / 180);
      const V = [0, 0, 0];
      function field(x, y, z) {
        const gx = (sample(x + ex, y, z) - sample(x - ex, y, z)) / ex;
        const gy = (sample(x, y + ex, z) - sample(x, y - ex, z)) / ex;
        const gz = (sample(x, y, z + ez) - sample(x, y, z - ez)) / ez;
        const r = Math.hypot(x, y);
        if (r < 1e-4) return false;
        const dx = -y / r * cphi, dy = x / r * cphi, dz = sphi;
        const vx = gy * dz - gz * dy, vy = gz * dx - gx * dz, vz = gx * dy - gy * dx;
        const m = Math.hypot(vx, vy, vz);
        if (m < 1e-6) return false;
        V[0] = vx / m; V[1] = vy / m; V[2] = vz / m; return true;
      }
      const qv = t => { const i = Math.min(99.999, t * 100), k = Math.floor(i); return quant[k] + (quant[k + 1] - quant[k]) * (i - k); };
      const thrSeed = qv(L.thr), thrStop = thrSeed * 0.6;
      const G = L.grid, occ = new Int32Array(G * G * G).fill(-1), occStep = new Int32Array(G * G * G);
      const C = [], S = [];
      for (let k = 0; k < n; k++) { C.push(Math.cos(2 * Math.PI * k / n)); S.push(Math.sin(2 * Math.PI * k / n)); }
      const cellOf = (x, y, z) => {
        const cx = Math.floor((x + VB) / (2 * VB) * G), cy = Math.floor((y + VB) / (2 * VB) * G), cz = Math.floor((z + VW) / (2 * VW) * G);
        return cx < 0 || cy < 0 || cz < 0 || cx >= G || cy >= G || cz >= G ? -1 : (cz * G + cy) * G + cx;
      };
      const mark = (x, y, z, id, s) => {
        for (let k = 0; k < n; k++) for (let m = 0; m < (mirror ? 2 : 1); m++) {
          const yy = m ? -y : y, c = cellOf(C[k] * x - S[k] * yy, S[k] * x + C[k] * yy, z);
          if (c >= 0 && occ[c] === -1) { occ[c] = id; occStep[c] = s; }
        }
      };
      const h = 0.7 * (2 * VB / 128), maxSteps = L.steps;     // 刻みは解像度によらず ver.3（128³）と同じ長さ
      function trace(x, y, z, dir, id, out) {
        let s = 0;
        while (s < maxSteps) {
          if (!field(x, y, z)) break;
          const mx = x + V[0] * h * 0.5 * dir, my = y + V[1] * h * 0.5 * dir, mz = z + V[2] * h * 0.5 * dir;
          if (!field(mx, my, mz)) break;
          x += V[0] * h * dir; y += V[1] * h * dir; z += V[2] * h * dir;
          if (Math.abs(x) > VB || Math.abs(y) > VB || Math.abs(z) > VW) break;
          if (sample(x, y, z) < thrStop) break;
          const c = cellOf(x, y, z);
          if (c < 0) break;
          if (occ[c] !== -1 && (occ[c] !== id || s - occStep[c] > 12)) break;
          out.push(x, y, z); s++;
          if (s % 2 === 0) mark(x, y, z, id, s);
        }
      }
      const lines = [];
      let id = 0, verts = 0;
      for (let a = 0; a < L.tries && verts < L.maxVerts; a++) {
        const r = 0.1 + Math.sqrt(Math.random()) * 0.88, t = Math.random() * 2 * Math.PI;
        const x = r * Math.cos(t), y = r * Math.sin(t), z = (Math.random() * 2 - 1) * VW * 0.95;
        if (sample(x, y, z) < thrSeed) continue;
        const c = cellOf(x, y, z);
        if (c < 0 || occ[c] !== -1) continue;
        const fw = [], bw = [];
        trace(x, y, z, 1, id, fw); trace(x, y, z, -1, id, bw);
        const np = fw.length / 3 + bw.length / 3 + 1;
        if (np < 12) continue;
        const pts = new Float32Array(np * 3);
        let o = 0;
        for (let i = bw.length - 3; i >= 0; i -= 3) { pts[o++] = bw[i]; pts[o++] = bw[i + 1]; pts[o++] = bw[i + 2]; }
        pts[o++] = x; pts[o++] = y; pts[o++] = z;
        for (let i = 0; i < fw.length; i++) pts[o++] = fw[i];
        let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity, z0 = Infinity, z1 = -Infinity;
        for (let i = 0; i < pts.length; i += 3) {
          x0 = Math.min(x0, pts[i]); x1 = Math.max(x1, pts[i]); y0 = Math.min(y0, pts[i + 1]); y1 = Math.max(y1, pts[i + 1]);
          z0 = Math.min(z0, pts[i + 2]); z1 = Math.max(z1, pts[i + 2]);
        }
        mark(x, y, z, id, 0);
        if (Math.hypot(x1 - x0, y1 - y0, (z1 - z0) * 0.5) < L.minSize) { id++; continue; }
        lines.push(pts); verts += np; id++;
      }
      // 上から見るので頂点は xy だけ ＋ (弧長 s, 全長, 密度, 高さ z)
      const V6 = new Float32Array(verts * 6), I = new Uint32Array(verts + lines.length);
      let vi = 0, ii = 0, base = 0;
      for (const pts of lines) {
        const np = pts.length / 3;
        let len = 0;
        for (let i = 1; i < np; i++) len += Math.hypot(pts[i * 3] - pts[i * 3 - 3], pts[i * 3 + 1] - pts[i * 3 - 2], pts[i * 3 + 2] - pts[i * 3 - 1]);
        let s = 0;
        for (let i = 0; i < np; i++) {
          if (i) s += Math.hypot(pts[i * 3] - pts[i * 3 - 3], pts[i * 3 + 1] - pts[i * 3 - 2], pts[i * 3 + 2] - pts[i * 3 - 1]);
          const x = pts[i * 3], y = pts[i * 3 + 1], z = pts[i * 3 + 2];
          V6[vi++] = x; V6[vi++] = y; V6[vi++] = s; V6[vi++] = len; V6[vi++] = Math.min(1.5, sample(x, y, z)); V6[vi++] = z / VW;
          I[ii++] = base + i;
        }
        I[ii++] = 0xFFFFFFFF; base += np;
      }
      return { verts: V6, idx: I, nLines: lines.length, reps: n * (mirror ? 2 : 1), n };
    }

    onmessage = e => {
      const { job, base, vary: v, exact, res, total, lines } = e.data;
      let q = search(base, v, exact), st = volume(q, res, total);
      if (!st && q !== base) { q = base; st = volume(q, res, total); }
      if (!st) { postMessage({ job, fail: true }); return; }
      const m = makeLines(st, lines);
      postMessage({ job, q, ...m }, [m.verts.buffer, m.idx.buffer]);
    };
  }

  // ==================================================================================
  // Worker プール（大きい花から順に計算）
  // ==================================================================================
  const wurl = URL.createObjectURL(new Blob([`const VB=${VB},VW=${VW};(${flowerWorker.toString()})()`], { type: "text/javascript" }));
  const nWorkers = Math.max(2, Math.min(coarse ? 3 : 6, (navigator.hardwareConcurrency || 4) - 1));
  const pool = [];
  let queue = [], jobSeq = 0;
  const pending = new Map();
  function makeWorker() {
    const w = new Worker(wurl);
    w.busy = false;
    w.onmessage = e => { w.busy = false; onResult(e.data); pump(); };
    return w;
  }
  for (let i = 0; i < nWorkers; i++) pool.push(makeWorker());
  function pump() {
    for (const w of pool) {
      if (w.busy || !queue.length) continue;
      const f = queue.shift();
      if (f.dead) continue;
      w.busy = true; f.job = ++jobSeq; pending.set(f.job, f);
      w.postMessage({ job: f.job, base: f.base, vary: f.vary, exact: f.exact, ...f.cfg });
    }
    updateStatus();
  }
  // 画面いっぱいに作り直すときは計算中の Worker を捨てる
  function resetPool() {
    queue = []; pending.clear();
    for (let i = 0; i < pool.length; i++) if (pool[i].busy) { pool[i].terminate(); pool[i] = makeWorker(); }
  }

  // ==================================================================================
  // WebGL：線を上から（xy 平面に正射影して）描く。対称像はインスタンス描画で複製
  // ==================================================================================
  function compile(vs, fs) {
    const pr = gl.createProgram();
    for (const [type, src] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
      const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
      gl.attachShader(pr, s);
    }
    gl.linkProgram(pr);
    if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(pr));
    return pr;
  }
  const prog = compile(`#version 300 es
    in vec2 aPos; in vec4 aAttr;
    uniform vec2 uCenter, uScale; uniform float uAngle; uniform int uN;
    out vec4 vA;
    void main() {
      int k = gl_InstanceID % uN;
      vec2 p = aPos;
      if (gl_InstanceID >= uN) p.y = -p.y;                                  // 鏡映
      float a = 6.28318530718 * float(k) / float(uN) + uAngle, c = cos(a), s = sin(a);
      p = vec2(c * p.x - s * p.y, s * p.x + c * p.y);                       // n 回回転 ＋ ゆっくり自転
      gl_Position = vec4(uCenter + p * uScale, 0.0, 1.0);
      vA = aAttr;
    }`, `#version 300 es
    precision highp float;
    in vec4 vA; out vec4 o;
    uniform vec3 uC1, uC2; uniform float uAlpha, uTime, uGlow;
    void main() {
      float s = vA.x, L = max(vA.y, 1e-4), u = s / L;
      float taper = smoothstep(0.0, 0.15, u) * smoothstep(1.0, 0.85, u);   // 筆の入りと抜き
      vec3 col = mix(uC1, uC2, smoothstep(0.15, 1.1, vA.z));
      float ph = fract(s * 1.6 - uTime);                                   // 線に沿って進む光の粒
      float pulse = 0.45 + 1.6 * exp(-ph * 9.0) * uGlow;
      float near = mix(0.45, 1.0, clamp(vA.w * 0.5 + 0.5, 0.0, 1.0));      // 上にある線ほど明るく（元の遠近の名残）
      float a = uAlpha * taper * near * pulse;
      o = vec4(col * a, a);
    }`);
  const U = {};
  for (const n of ["uCenter", "uScale", "uAngle", "uN", "uC1", "uC2", "uAlpha", "uTime", "uGlow"]) U[n] = gl.getUniformLocation(prog, n);
  const LP = gl.getAttribLocation(prog, "aPos"), LA = gl.getAttribLocation(prog, "aAttr");

  const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255);
  const INKS = {
    night: [["#1f6bff", "#c8f6ff"]],
    gold:  [["#9c561a", "#ffe3a3"]],
    mix:   [["#1f6bff", "#c8f6ff"], ["#9c561a", "#ffe3a3"], ["#c2306e", "#ffd6ea"], ["#138a72", "#c9ffe9"],
            ["#6b3cff", "#e6dcff"], ["#1f6bff", "#c8f6ff"]],
  };
  let palette = "night";
  try { palette = localStorage.getItem("gfoc.garden.palette") || "night"; } catch {}
  if (!INKS[palette]) palette = "night";
  $("palette").value = palette;
  function inkFor(f) { const l = INKS[palette]; return l[f.inkIdx % l.length].map(hex); }

  // ==================================================================================
  // 配置：大・中・小の円をランダムに、重なりを少しだけ許して画面いっぱいに詰める
  // ==================================================================================
  let flowers = [], W = 0, H = 0, dpr = 1;
  const SIZES = {
    L: { d: [0.62, 0.86], res: 96, total: 5e6, grid: 52, steps: 320, maxVerts: coarse ? 50000 : 80000, tries: 50000 },
    M: { d: [0.36, 0.50], res: 80, total: 3e6, grid: 42, steps: 260, maxVerts: coarse ? 22000 : 32000, tries: 30000 },
    S: { d: [0.17, 0.27], res: 64, total: 1.6e6, grid: 32, steps: 190, maxVerts: 9000, tries: 16000 },
  };
  function layout() {
    const m = Math.min(W, H), area = W * H, out = [];
    const rnd = (a, b) => a + Math.random() * (b - a);
    const fits = (x, y, r) => out.every(o => Math.hypot(o.x - x, o.y - y) >= (o.r + r) * 0.86);
    const place = (cls, count, attempts) => {
      for (let c = 0; c < count; c++) {
        for (let t = 0; t < attempts; t++) {
          const r = rnd(...SIZES[cls].d) * m / 2;
          // 端からは半径の 25% まではみ出してよい（画面の縁まで花で埋める）
          const x = rnd(r * 0.75, W - r * 0.75), y = rnd(r * 0.75, H - r * 0.75);
          if (fits(x, y, r)) { out.push({ cls, x, y, r }); break; }
        }
      }
    };
    const nL = Math.max(1, Math.round(area / (m * m) * (0.9 + Math.random() * 0.6)));
    place("L", nL, 300);
    place("M", Math.round(area / (m * m) * 4), 300);
    place("S", 40, 300);
    // 残った隙間にもう一度、中→小の順で
    place("M", 4, 200); place("S", 20, 200);
    return out.slice(0, 40);
  }

  function newFlower(o, first) {
    const cfg = SIZES[o.cls];
    const f = { cls: o.cls, x: o.x, y: o.y, r: o.r, cfg: { res: cfg.res, total: cfg.total,
                lines: { phi: FLOW.phi, grid: cfg.grid, thr: FLOW.thr, steps: cfg.steps, tries: cfg.tries, maxVerts: cfg.maxVerts, minSize: FLOW.minSize } },
                base: BASE, vary: +$("vary").value, exact: !!first,
                angle: Math.random() * 6.283, spin: (Math.random() < 0.5 ? -1 : 1) * (0.02 + Math.random() * 0.06) * (o.cls === "S" ? 1.6 : o.cls === "M" ? 1.2 : 1),
                tOff: Math.random() * 10, tempo: 0.55 + Math.random() * 0.35, inkIdx: Math.floor(Math.random() * 60),
                vao: null, vbo: null, ibo: null, count: 0, ready: false, born: 0 };
    return f;
  }
  function freeFlower(f) {
    f.dead = true;
    if (f.vao) { gl.deleteVertexArray(f.vao); gl.deleteBuffer(f.vbo); gl.deleteBuffer(f.ibo); f.vao = null; }
  }
  function enqueue(f) { queue.push(f); queue.sort((a, b) => b.r - a.r); pump(); }

  function regenerate() {
    resetPool();
    flowers.forEach(freeFlower);
    const L = layout();
    L.sort((a, b) => b.r - a.r);
    flowers = L.map((o, i) => newFlower(o, i === 0));     // 一番大きい花は元の「菊」そのもの
    flowers.slice().forEach(enqueue);
  }

  function onResult(m) {
    const f = pending.get(m.job);
    pending.delete(m.job);
    if (!f || f.dead) return;
    if (m.fail) { updateStatus(); return; }
    f.q = m.q;
    f.vao = gl.createVertexArray(); f.vbo = gl.createBuffer(); f.ibo = gl.createBuffer();
    gl.bindVertexArray(f.vao);
    gl.bindBuffer(gl.ARRAY_BUFFER, f.vbo); gl.bufferData(gl.ARRAY_BUFFER, m.verts, gl.STATIC_DRAW);
    gl.enableVertexAttribArray(LP); gl.vertexAttribPointer(LP, 2, gl.FLOAT, false, 24, 0);
    gl.enableVertexAttribArray(LA); gl.vertexAttribPointer(LA, 4, gl.FLOAT, false, 24, 8);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, f.ibo); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, m.idx, gl.STATIC_DRAW);
    gl.bindVertexArray(null);
    f.count = m.idx.length; f.reps = m.reps; f.n = m.n; f.ready = true; f.born = performance.now();
  }

  let statusTimer = null;
  function updateStatus() {
    const done = flowers.filter(f => f.ready).length, total = flowers.length;
    statusEl.style.opacity = 1;
    statusEl.textContent = done < total ? `咲いています… ${done} / ${total}` : `${total} 輪`;
    clearTimeout(statusTimer);
    if (done === total) statusTimer = setTimeout(() => { statusEl.style.opacity = 0; }, 2500);
  }

  // ==================================================================================
  // 描画
  // ==================================================================================
  function resize() {
    const nW = canvas.clientWidth, nH = canvas.clientHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const bw = Math.round(nW * dpr), bh = Math.round(nH * dpr);
    if (canvas.width !== bw || canvas.height !== bh) { canvas.width = bw; canvas.height = bh; }
    if (!W) { W = nW; H = nH; return true; }
    // 幅が変わった（回転など）ら並べ直す。高さだけの小さな変化（アドレスバー）は位置を伸縮するだけ
    if (Math.abs(nW - W) > 1 || Math.abs(nH - H) / H > 0.2) { W = nW; H = nH; return true; }
    if (nH !== H) { for (const f of flowers) f.y *= nH / H; H = nH; }
    return false;
  }

  let paused = false, last = performance.now(), clock = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (!paused) clock += dt;
    if (resize()) regenerate();
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.clearColor(0.0196, 0.0235, 0.043, 1); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.useProgram(prog);
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);       // 暗い背景に光の線を加算
    gl.uniform1f(U.uGlow, 1);
    for (const f of flowers) {
      if (!f.ready) continue;
      const fade = Math.min(1, (now - f.born) / 1400);
      const [c1, c2] = inkFor(f);
      gl.uniform2f(U.uCenter, f.x / W * 2 - 1, 1 - f.y / H * 2);
      gl.uniform2f(U.uScale, f.r / W * 2, f.r / H * 2);
      gl.uniform1f(U.uAngle, f.angle + f.spin * clock);
      gl.uniform1i(U.uN, f.n);
      gl.uniform3fv(U.uC1, c1); gl.uniform3fv(U.uC2, c2);
      // 小さな花は線が重なって白飛びしやすいので少し薄く
      gl.uniform1f(U.uAlpha, 0.4 * fade * (f.cls === "S" ? 0.8 : f.cls === "M" ? 0.9 : 1));
      gl.uniform1f(U.uTime, f.tOff + clock * f.tempo);
      gl.bindVertexArray(f.vao);
      gl.drawElementsInstanced(gl.LINE_STRIP, f.count, gl.UNSIGNED_INT, 0, f.reps);
    }
    gl.bindVertexArray(null);
    gl.disable(gl.BLEND);
    if (frame.capture) { const cb = frame.capture; frame.capture = null; cb(); }
    requestAnimationFrame(frame);
  }

  // ==================================================================================
  // 操作
  // ==================================================================================
  $("regen").addEventListener("click", regenerate);
  $("vary").addEventListener("change", regenerate);
  $("palette").addEventListener("change", () => {
    palette = $("palette").value;
    try { localStorage.setItem("gfoc.garden.palette", palette); } catch {}
  });
  $("save").addEventListener("click", () => {
    frame.capture = () => {
      const a = document.createElement("a"); a.download = "flower-garden.png"; a.href = canvas.toDataURL("image/png"); a.click();
    };
  });
  // 花をタップするとその花だけ咲き直す（ダブルタップで 3D 版 ver.3 に開く）
  let lastTap = { f: null, t: 0 };
  canvas.addEventListener("click", e => {
    const x = e.clientX, y = e.clientY;
    let hit = null, best = Infinity;
    for (const f of flowers) { const d = Math.hypot(f.x - x, f.y - y) / f.r; if (d < 0.9 && d < best) { best = d; hit = f; } }
    wake();
    if (!hit) return;
    const now = performance.now();
    if (lastTap.f === hit && now - lastTap.t < 350 && hit.q) {
      const q = hit.q, p = [q.n, q.lam, q.alpha, q.beta, q.gamma, q.omega, q.kap, q.mu, q.del, q.eps].map(v => +(+v).toFixed(4));
      location.href = `3d-v3.html?mode=flow&p=${p.join(",")}`;
      return;
    }
    lastTap = { f: hit, t: now };
    setTimeout(() => {
      if (lastTap.f !== hit || lastTap.t !== now) return;
      const i = flowers.indexOf(hit);
      if (i < 0) return;
      freeFlower(hit);
      const nf = newFlower(hit, false);
      flowers[i] = nf; enqueue(nf);
    }, 360);
  });
  // 操作バーはしばらく触らないと消える
  let idleTimer = null;
  function wake() { $("bar").classList.remove("idle"); clearTimeout(idleTimer); idleTimer = setTimeout(() => $("bar").classList.add("idle"), 4000); }
  for (const ev of ["pointermove", "pointerdown", "keydown"]) window.addEventListener(ev, wake, { passive: true });
  document.addEventListener("visibilitychange", () => { paused = document.hidden; last = performance.now(); });

  resize(); regenerate(); wake();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
