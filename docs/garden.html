<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6efe8">
<title>Flower Garden — 流線の花畑</title>
<meta name="description" content="3D 版 ver.3 の流線を上から見た姿だけを使い、形の方向性と色を選び、パラメータを少しずつ変えた花を大・中・小ランダムに画面いっぱいに並べて動かす。">
<style>
:root { --bg: #f6efe8; --fg: #e8ecf6; --muted: #8d93a6; --bar: rgba(16, 18, 28, .72); --line: rgba(255, 255, 255, .14); --accent: #f07aa8; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;
  font: 14px/1.5 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: manipulation; }
#bar {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(12px + env(safe-area-inset-bottom)); max-width: calc(100vw - 24px);
  display: flex; gap: 6px; align-items: center; padding: 6px; border-radius: 999px;
  background: var(--bar); border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  transition: opacity .4s;
}
#bar.idle { opacity: 0; pointer-events: none; }
#bar button, #bar select, #bar a {
  font: inherit; font-size: 13px; color: var(--fg); background: transparent; border: 0; border-radius: 999px;
  padding: 7px 12px; cursor: pointer; white-space: nowrap; text-decoration: none;
}
#bar select { appearance: none; -webkit-appearance: none; background: rgba(255,255,255,.06); }
#bar select option { background: #15141c; }
#bar button.primary { background: var(--accent); color: #fff; }
#status { position: fixed; left: 12px; top: calc(8px + env(safe-area-inset-top)); font: 11px ui-monospace, Menlo, monospace;
  color: var(--muted); pointer-events: none; transition: opacity .6s; }
#panel {
  position: fixed; left: 50%; transform: translateX(-50%); width: min(360px, calc(100vw - 24px));
  bottom: calc(66px + env(safe-area-inset-bottom)); max-height: calc(100dvh - 100px); overflow-y: auto;
  padding: 14px 16px; border-radius: 16px; background: var(--bar); border: 1px solid var(--line);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
}
#panel h4 { margin: 12px 0 4px; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .04em; }
#panel h4:first-child { margin-top: 0; }
#panel select { width: 100%; font: inherit; font-size: 14px; color: var(--fg); background: rgba(255,255,255,.06);
  border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
#panel select option { background: #15141c; }
#panel .note { margin: 4px 0 0; font-size: 12px; color: var(--muted); }
#panel .colors { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
#panel .colors label { display: grid; gap: 2px; font-size: 11px; color: var(--muted); text-align: center; }
#panel input[type=color] { width: 100%; height: 30px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: none; }
#panel .seg { display: grid; grid-auto-flow: column; gap: 6px; }
#panel .seg button { font: inherit; font-size: 13px; color: var(--fg); background: rgba(255,255,255,.06); border: 1px solid var(--line);
  border-radius: 8px; padding: 6px 0; cursor: pointer; }
#panel .seg button[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: #fff; }
#bar button[aria-expanded=true] { background: rgba(255,255,255,.14); }
#nogl { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: #ccc; }
</style>
</head>
<body>
<canvas id="gl" aria-label="流線で描いた対称カオス写像の花が、大きさを変えて画面いっぱいに並ぶ"></canvas>
<div id="status"></div>
<div id="nogl" hidden>この環境では WebGL2 が使えません。</div>
<div id="panel" hidden>
  <h4>方向性（元にする形）</h4>
  <select id="preset" aria-label="方向性"></select>
  <p class="note" id="presetNote"></p>
  <h4>色</h4>
  <select id="style" aria-label="色"></select>
  <div class="colors">
    <label>背景<input type="color" id="cBg"></label>
    <label>線（暗）<input type="color" id="c1"></label>
    <label>線（明）<input type="color" id="c2"></label>
  </div>
  <h4>大きさ</h4>
  <div class="seg" id="sizeSeg"><button data-v="0.5">小さめ</button><button data-v="0.7">ふつう</button><button data-v="1">大きめ</button></div>
  <h4>ゆらぎ（元の形からの離れ方）</h4>
  <div class="seg" id="varySeg"><button data-v="0.25">小</button><button data-v="0.55">中</button><button data-v="1">大</button></div>
  <h4>自動で咲き直す（12 秒後に心拍 → 加速とノイズ → 次の花へ）</h4>
  <div class="seg" id="autoSeg"><button data-v="1">オン</button><button data-v="0">オフ</button></div>
</div>
<div id="bar">
  <a href="3d-v3.html" title="3D 版 ver.3 へ">←</a>
  <button id="regen" class="primary">咲き直す</button>
  <button id="settings" aria-expanded="false" aria-controls="panel">設定</button>
  <button id="save">PNG</button>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const canvas = $("gl"), statusEl = $("status");
  const gl = canvas.getContext("webgl2", { antialias: true, premultipliedAlpha: false, preserveDrawingBuffer: false });
  if (!gl || typeof Worker === "undefined") { $("nogl").hidden = false; $("bar").hidden = true; return; }

  // 元にする形：3D 版 ver.3 のプリセット（花ごとに少しずつ揺らす）
  const PRESETS = [
    ["菊 — Chrysanthemum", { n: 12, lam: -2.661, alpha: 3.61, beta: 0.31, gamma: -0.437, omega: 0, kap: -0.226, mu: 0.6, del: -0.138, eps: 0.289 },
      "12 回対称に並ぶ小花の粒。中心ほど密になる。"],
    ["クラゲ — Jellyfish", { n: 10, lam: 2.591, alpha: -4.072, beta: 1.106, gamma: -0.888, omega: 0.163, kap: -0.154, mu: 0.279, del: -0.719, eps: -0.432 },
      "傘のひだは 10 回対称に整い、縁は不規則に波打つ。"],
    ["薔薇 — Rose", { n: 5, lam: 2.564, alpha: -3.498, beta: 0.407, gamma: 1.121, omega: 0.085, kap: 0.083, mu: 0.442, del: 0.445, eps: 0.481 },
      "ω ≠ 0 で鏡映が破れ、花弁が一方向に巻き込む 5 回対称。"],
    ["百合 — Lily", { n: 3, lam: 2.287, alpha: -4.237, beta: -1.344, gamma: 0.181, omega: 0, kap: -0.193, mu: 0.775, del: -0.563, eps: -0.014 },
      "単子葉植物の花と同じ 3 回対称のつぼみ。"],
    ["蓮の花托 — Lotus Pod", { n: 10, lam: 2.285, alpha: -2.005, beta: -0.524, gamma: 1.167, omega: 0, kap: 0, mu: 0.679, del: 0.075, eps: 0.318 },
      "同心円状に並ぶ穴。"],
    ["イソギンチャク — Sea Anemone", { n: 11, lam: -2.007, alpha: 1.74, beta: 0.77, gamma: 1.022, omega: 0, kap: 0.111, mu: 0.491, del: -0.62, eps: 0.493 },
      "放射状に伸びる触手。一本ごとの起伏はカオスが決める。"],
    ["ウニの殻 — Urchin Test", { n: 11, lam: 2.723, alpha: -4.085, beta: 1.064, gamma: -0.668, omega: 0, kap: -0.259, mu: 0.464, del: 0.012, eps: 0.457 },
      "ドーム状の殻に刻まれた放射状の溝。"],
    ["ハイビスカス — Hibiscus", { n: 6, lam: -2.442, alpha: 4.305, beta: 1.447, gamma: -0.619, omega: 0.18, kap: -0.202, mu: 0.522, del: 0.843, eps: -0.379 },
      "重なり合う 6 枚の花弁。花弁が交互に反る。"],
    ["朝顔 — Morning Glory", { n: 9, lam: -2.637, alpha: 4.544, beta: -0.323, gamma: 1.084, omega: 0, kap: -0.01, mu: 0.302, del: -0.305, eps: 0.003 },
      "ひだを畳んだラッパ形。折り目は 9 回対称。"],
    ["サンゴ — Coral", { n: 8, lam: 2.356, alpha: -4.973, beta: -0.914, gamma: 0.184, omega: 0.277, kap: -0.149, mu: 0.545, del: 0.347, eps: -0.279 },
      "環状に群れて育つ、ねじれた枝の塊。"],
  ];
  const MIX = "mix";
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };
  // 基本のデザイン：形は「ミックス」、色は「紅と藍」、大きさは「ふつう」
  const opt = { preset: "mix", style: "0", bg: null, c1: null, c2: null, size: 0.7, vary: 0.55, auto: 1, ...(store.get("gfoc.garden.v3") || {}) };
  const saveOpt = () => store.set("gfoc.garden.v3", opt);
  // 流線の設定（ver.3 の初期値）
  const FLOW = { phi: 82, thr: 0.45, minSize: 0.16 };
  const VB = 1.08, VW = 1.25;
  const coarse = matchMedia("(pointer: coarse)").matches;

  // ==================================================================================
  // Worker：パラメータを揺らして良い形を探し → 密度ボリューム → 流線
  // （3d-v3.html と同じ計算。表示は上から見た xy だけを使う）
  // ==================================================================================
  function flowerWorker() {
    let NX = 0, NY = 0, NW = 0;
    function step(q, x, y, w) {
      const zz = x * x + y * y;
      let zr = x, zi = y;
      for (let i = 1; i < q.n - 1; i++) { const t = zr * x - zi * y; zi = zr * y + zi * x; zr = t; }
      const ren = zr * x - zi * y;
      const r = Math.sqrt(zz), cosn = r > 1e-12 ? ren / Math.pow(r, q.n) : 0;
      const p = q.lam + q.kap * w + q.alpha * zz + q.beta * ren;
      NX = p * x - q.omega * y + q.gamma * zr;
      NY = p * y + q.omega * x - q.gamma * zi;
      NW = q.mu * w + q.del * r * cosn + q.eps * zz;
    }
    const ok = (x, y, w) => Math.abs(x) + Math.abs(y) + Math.abs(w) < 1e4;

    function probe(q, N = 20000) {
      let x = 0.01, y = 0.003, w = 0, R = 0;
      for (let i = 0; i < N; i++) {
        step(q, x, y, w); x = NX; y = NY; w = NW;
        if (!ok(x, y, w)) return null;
        if (i > 2000) { const r = x * x + y * y; if (r > R) R = r; }
      }
      R = Math.sqrt(R);
      return R > 1e-6 ? { R, x, y, w } : null;
    }
    // 箱数え次元・高さの幅・広がり・Lyapunov 指数で、点・閉曲線・塗りつぶし・周期軌道を除外
    function quality(q, pr) {
      const cells = new Set(), cells2 = new Set(), xy = new Set();
      let x = pr.x, y = pr.y, w = pr.w, wmin = Infinity, wmax = -Infinity;
      const pts = [];
      for (let i = 0; i < 30000; i++) {
        step(q, x, y, w); x = NX; y = NY; w = NW;
        if (!ok(x, y, w)) return null;
        pts.push(x, y, w); if (w < wmin) wmin = w; if (w > wmax) wmax = w;
      }
      const wr = Math.max(wmax - wmin, 1e-9);
      for (let i = 0; i < pts.length; i += 3) {
        const a = Math.min(1, Math.max(0, (pts[i] / pr.R + 1) / 2)), b = Math.min(1, Math.max(0, (pts[i + 1] / pr.R + 1) / 2)), c = (pts[i + 2] - wmin) / wr;
        xy.add(((a * 31) | 0) * 32 + ((b * 31) | 0));
        cells.add(((a * 31) | 0) * 4096 + ((b * 31) | 0) * 64 + ((c * 31) | 0));
        cells2.add(((a * 63) | 0) * 65536 + ((b * 63) | 0) * 256 + ((c * 63) | 0));
      }
      const d0 = 1e-8; let x2 = x + d0, y2 = y, w2 = w, lsum = 0;
      for (let i = 0; i < 1500; i++) {
        step(q, x, y, w); const ax = NX, ay = NY, aw = NW;
        step(q, x2, y2, w2);
        const dx = NX - ax, dy = NY - ay, dw = NW - aw, dd = Math.hypot(dx, dy, dw) || 1e-300;
        lsum += Math.log(dd / d0);
        x = ax; y = ay; w = aw; x2 = ax + dx * d0 / dd; y2 = ay + dy * d0 / dd; w2 = aw + dw * d0 / dd;
      }
      return { D: Math.log2(cells2.size / cells.size), wr: wr / pr.R, n2: cells.size,
               xy: xy.size / (Math.PI * 16 * 16), lyap: lsum / 1500 };
    }
    const good = s => s && s.D > 1.3 && s.D < 2.5 && s.wr > 0.1 && s.n2 > 400 && s.xy > 0.12 && s.lyap > 0.02;

    const rnd = (lo, hi) => lo + Math.random() * (hi - lo);
    function vary(base, v) {
      const g = () => (Math.random() + Math.random() + Math.random() - 1.5) * 2 * v;   // おおよそ ±v の山形
      const c = { ...base,
        lam: base.lam + g() * 0.5, alpha: base.alpha + g() * 1.0, beta: base.beta + g() * 0.5,
        gamma: base.gamma + g() * 0.45, kap: base.kap + g() * 0.12, mu: Math.min(0.92, Math.max(0.15, base.mu + g() * 0.18)),
        del: base.del + g() * 0.45, eps: base.eps + g() * 0.25 };
      if (Math.random() < v * 0.5) c.n = Math.max(3, Math.min(14, base.n + Math.round(g() * 3)));   // 対称の数も時々変える
      if (base.omega === 0 ? Math.random() < v * 0.15 : true) c.omega = base.omega + g() * 0.1;      // 鏡映を破る形はそのまま揺らす
      return c;
    }
    function search(base, v, exact) {
      if (exact) { const pr = probe(base); if (pr) return base; }
      for (let t = 0; t < 400; t++) {
        const c = vary(base, v * (1 + t / 200));
        const pr = probe(c);
        if (!pr) continue;
        if (good(quality(c, pr))) return c;
      }
      return base;
    }

    function blur(a, res) {
      const k = [Math.exp(-2), Math.exp(-0.5), 1, Math.exp(-0.5), Math.exp(-2)];
      const ks = k.reduce((s, v) => s + v, 0); for (let i = 0; i < 5; i++) k[i] /= ks;
      let src = a, dst = new Float32Array(a.length);
      for (const stride of [1, res, res * res]) {
        for (let z = 0; z < res; z++) for (let y = 0; y < res; y++) {
          const base = (z * res + y) * res;
          for (let x = 0; x < res; x++) {
            const i = base + x, c = stride === 1 ? x : stride === res ? y : z;
            let s = 0;
            for (let o = -2; o <= 2; o++) { const cc = c + o; if (cc >= 0 && cc < res) s += k[o + 2] * src[i + o * stride]; }
            dst[i] = s;
          }
        }
        [src, dst] = [dst, src];
      }
      return src;
    }

    function volume(q, res, total) {
      let x = 0.01, y = 0.003, w = 0, R = 0;
      for (let i = 0; i < 20000; i++) {
        step(q, x, y, w); x = NX; y = NY; w = NW;
        if (!ok(x, y, w)) return null;
        if (i > 2000) R = Math.max(R, x * x + y * y);
      }
      R = Math.sqrt(R);
      if (!(R > 1e-6)) return null;
      const samp = new Float64Array(20000);
      for (let i = 0; i < samp.length; i++) { step(q, x, y, w); x = NX; y = NY; w = NW; samp[i] = w; }
      samp.sort();
      const lo = samp[200], hi = samp[19800], mid = (lo + hi) / 2, half = Math.max((hi - lo) / 2, 1e-6);
      const mirror = Math.abs(q.omega) < 1e-9, reps = q.n * (mirror ? 2 : 1);
      const C = [], S = [];
      for (let k = 0; k < q.n; k++) { C.push(Math.cos(2 * Math.PI * k / q.n)); S.push(Math.sin(2 * Math.PI * k / q.n)); }
      const N = Math.ceil(total / reps);
      const vol = new Float32Array(res * res * res), r2 = res * res;
      const sxy = res / (2 * VB), sw = res / (2 * VW);
      function splat(px, py, fz, iz, wz) {
        const fx = (px + VB) * sxy - 0.5, fy = (py + VB) * sxy - 0.5;
        const ix = Math.floor(fx), iy = Math.floor(fy);
        if (ix < 0 || iy < 0 || ix >= res - 1 || iy >= res - 1) return;
        const ax = fx - ix, ay = fy - iy, i0 = iz * r2 + iy * res + ix, i1 = i0 + r2;
        const w00 = (1 - ax) * (1 - ay), w10 = ax * (1 - ay), w01 = (1 - ax) * ay, w11 = ax * ay, bz = 1 - wz;
        vol[i0] += w00 * bz; vol[i0 + 1] += w10 * bz; vol[i0 + res] += w01 * bz; vol[i0 + res + 1] += w11 * bz;
        vol[i1] += w00 * wz; vol[i1 + 1] += w10 * wz; vol[i1 + res] += w01 * wz; vol[i1 + res + 1] += w11 * wz;
      }
      for (let i = 0; i < N; i++) {
        step(q, x, y, w); x = NX; y = NY; w = NW;
        if (!ok(x, y, w)) break;
        const fz = ((w - mid) / half + VW) * sw - 0.5, iz = Math.floor(fz);
        if (iz < 0 || iz >= res - 1) continue;
        const wz = fz - iz, X = x / R, Y = y / R;
        for (let k = 0; k < q.n; k++) {
          const c = C[k], s = S[k];
          splat(c * X - s * Y, s * X + c * Y, fz, iz, wz);
          if (mirror) splat(c * X + s * Y, s * X - c * Y, fz, iz, wz);
        }
      }
      for (let i = 0; i < vol.length; i++) vol[i] = Math.log1p(vol[i]);
      const out = blur(vol, res);
      let mx = 0; for (let i = 0; i < out.length; i++) if (out[i] > mx) mx = out[i];
      const vals = [], strideS = Math.max(1, Math.floor(out.length / 400000));
      for (let i = 0; i < out.length; i += strideS) if (out[i] > mx * 0.02) vals.push(out[i]);
      vals.sort((a, b) => a - b);
      const p = vals.length ? vals[Math.floor(vals.length * 0.995)] : 1, sc = 1 / (p || 1);
      for (let i = 0; i < out.length; i++) out[i] *= sc;
      const quant = [];
      for (let i = 0; i <= 100; i++) quant.push(vals.length ? vals[Math.min(vals.length - 1, Math.floor(vals.length * i / 100))] * sc : i / 100);
      return { res, vol: blur(blur(out, res), res), quant, n: q.n, mirror };
    }

    // v = ∇ρ × (cosφ e_θ + sinφ e_z) を積分した、等値面の上を走る線
    function makeLines(st, L) {
      const { res, vol, quant, n, mirror } = st;
      const r2 = res * res, sxy = res / (2 * VB), sw = res / (2 * VW);
      const sample = (x, y, z) => {
        const fx = (x + VB) * sxy - 0.5, fy = (y + VB) * sxy - 0.5, fz = (z + VW) * sw - 0.5;
        const ix = Math.floor(fx), iy = Math.floor(fy), iz = Math.floor(fz);
        if (ix < 0 || iy < 0 || iz < 0 || ix >= res - 1 || iy >= res - 1 || iz >= res - 1) return 0;
        const ax = fx - ix, ay = fy - iy, az = fz - iz, i = iz * r2 + iy * res + ix;
        const c00 = vol[i] + (vol[i + 1] - vol[i]) * ax, c10 = vol[i + res] + (vol[i + res + 1] - vol[i + res]) * ax;
        const c01 = vol[i + r2] + (vol[i + r2 + 1] - vol[i + r2]) * ax, c11 = vol[i + r2 + res] + (vol[i + r2 + res + 1] - vol[i + r2 + res]) * ax;
        const c0 = c00 + (c10 - c00) * ay, c1 = c01 + (c11 - c01) * ay;
        return c0 + (c1 - c0) * az;
      };
      const ex = 2 * VB / res, ez = 2 * VW / res;
      const cphi = Math.cos(L.phi * Math.PI / 180), sphi = Math.sin(L.phi * Math.PI / 180);
      const V = [0, 0, 0];
      function field(x, y, z) {
        const gx = (sample(x + ex, y, z) - sample(x - ex, y, z)) / ex;
        const gy = (sample(x, y + ex, z) - sample(x, y - ex, z)) / ex;
        const gz = (sample(x, y, z + ez) - sample(x, y, z - ez)) / ez;
        const r = Math.hypot(x, y);
        if (r < 1e-4) return false;
        const dx = -y / r * cphi, dy = x / r * cphi, dz = sphi;
        const vx = gy * dz - gz * dy, vy = gz * dx - gx * dz, vz = gx * dy - gy * dx;
        const m = Math.hypot(vx, vy, vz);
        if (m < 1e-6) return false;
        V[0] = vx / m; V[1] = vy / m; V[2] = vz / m; return true;
      }
      const qv = t => { const i = Math.min(99.999, t * 100), k = Math.floor(i); return quant[k] + (quant[k + 1] - quant[k]) * (i - k); };
      const thrSeed = qv(L.thr), thrStop = thrSeed * 0.6;
      const G = L.grid, occ = new Int32Array(G * G * G).fill(-1), occStep = new Int32Array(G * G * G);
      const C = [], S = [];
      for (let k = 0; k < n; k++) { C.push(Math.cos(2 * Math.PI * k / n)); S.push(Math.sin(2 * Math.PI * k / n)); }
      const cellOf = (x, y, z) => {

    } else if (cyc.phase === "beat") {
      cyc.bpm = BPM0;
      // 次の花が計算し終わるまでは 80 bpm のまま待つ
      if (cyc.t >= BEAT && next && settled(next)) { cyc.phase = "rush"; cyc.t = 0; }
    } else if (cyc.phase === "rush") {
      const p = Math.min(1, cyc.t / RUSH);
      cyc.bpm = BPM0 + (BPM1 - BPM0) * p * p;
      if (p >= 1) {
        flowers.forEach(freeFlower);
        flowers = next.filter(f => f.ready); next = null;
        for (const f of flowers) { f.prio = 1; f.pre = false; }
        cyc.phase = "calm"; cyc.t = 0;
        updateStatus();
      }
    }
    if (cyc.phase === "beat" || cyc.phase === "rush") cyc.beat += dt * cyc.bpm / 60;
  }

  let paused = false, last = performance.now(), clock = 0;
  function drawSet(set, now, beating, scanClip, bandClip, tear) {
    const cx = W / 2, cy = H / 2, far = Math.hypot(cx, cy);
    for (const f of set) {
      if (!f.ready) continue;
      const fade = f.pre ? 1 : Math.min(1, (now - f.born) / 1400);
      // 心拍は画面の中心から外へ、少し遅れて伝わる
      const env = beating ? heart(((cyc.beat - 0.22 * Math.hypot(f.x - cx, f.y - cy) / far) % 1 + 1) % 1) : 0;
      const sc = 1 + 0.075 * env;
      const [c1, c2] = inkFor(f);
      gl.uniform2f(U.uCenter, f.x / W * 2 - 1, 1 - f.y / H * 2);
      gl.uniform2f(U.uScale, f.r / W * 2 * sc, f.r / H * 2 * sc);
      gl.uniform1f(U.uAngle, f.angle + f.spin * clock);
      gl.uniform1i(U.uN, f.n);
      gl.uniform3fv(U.uC1, c1); gl.uniform3fv(U.uC2, c2);
      // 小さな花は線が重なって白飛びしやすいので少し薄く
      gl.uniform1f(U.uAlpha, (dark ? 0.4 : 0.5) * fade * (f.cls === "S" ? 0.8 : f.cls === "M" ? 0.9 : 1) * (1 + 0.6 * env));
      gl.uniform1f(U.uTime, f.tOff + clock * f.tempo);
      gl.uniform1f(U.uScan, scanClip); gl.uniform1f(U.uBand, bandClip); gl.uniform1f(U.uTear, tear);
      gl.bindVertexArray(f.vao);
      gl.drawElementsInstanced(gl.LINE_STRIP, f.count, gl.UNSIGNED_INT, 0, f.reps);
    }
  }

  function frame(now) {
    const dt = paused ? 0 : Math.min(0.1, (now - last) / 1000); last = now;
    clock += dt;
    if (resize()) regenerate();
    stepCycle(dt);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.clearColor(bgRGB[0], bgRGB[1], bgRGB[2], 1); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.useProgram(prog);
    gl.enable(gl.BLEND);
    if (dark) gl.blendFunc(gl.ONE, gl.ONE);                 // 暗い背景：光の線を加算
    else gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);      // 明るい背景：墨を重ねる
    gl.uniform1f(U.uGlow, 1);
    if (cyc.phase === "rush" && Math.random() < 0.5) cyc.seed = Math.random() * 100;
    gl.uniform1f(U.uSeed, cyc.seed);
    const beating = cyc.phase === "beat" || cyc.phase === "rush";
    if (cyc.phase !== "rush") {
      drawSet(flowers, now, beating, -9, 1, 0);
    } else {
      // 走査線は上から下へ。通り過ぎた上側は次の花、まだの下側は今の花（心拍が加速中）
      const p = Math.min(1, cyc.t / RUSH);
      const bandPx = H * 0.22, scanY = -0.02 * H + p * (H + bandPx * 0.6);   // CSS px（上から）
      const scanClip = 1 - scanY / H * 2, bandClip = bandPx / H * 2;
      const tear = 0.05 + 0.12 * p;
      const split = Math.max(0, Math.min(canvas.height, Math.round((H - scanY) * dpr)));
      gl.enable(gl.SCISSOR_TEST);
      gl.scissor(0, 0, canvas.width, split);
      drawSet(flowers, now, true, scanClip, bandClip, tear);
      gl.scissor(0, split, canvas.width, canvas.height - split);
      drawSet(next, now, false, scanClip, bandClip, tear);
      gl.disable(gl.SCISSOR_TEST);
      // 砂嵐の帯
      gl.useProgram(noiseProg);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
      gl.uniform1f(NU.uScanPx, (H - scanY) * dpr); gl.uniform1f(NU.uBandPx, bandPx * dpr);
      gl.uniform1f(NU.uSeed, cyc.seed); gl.uniform1f(NU.uPx, Math.max(1, dpr * 1.5));
      gl.uniform1f(NU.uGrain, 0.05 + 0.1 * Math.sin(Math.PI * p));
      gl.uniform1f(NU.uDark, dark ? 1 : 0);
      gl.uniform3fv(NU.uInk, (inksRGB[0] || [[1, 1, 1], [1, 1, 1]])[dark ? 1 : 0]);
      gl.bindVertexArray(emptyVao);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
    gl.bindVertexArray(null);
    gl.disable(gl.BLEND);
    if (frame.capture) { const cb = frame.capture; frame.capture = null; cb(); }
    requestAnimationFrame(frame);
  }

  // ==================================================================================
  // 操作
  // ==================================================================================
  $("regen").addEventListener("click", regenerate);
  const presetSel = $("preset");
  PRESETS.forEach(([name], i) => presetSel.append(new Option(name, i)));
  presetSel.append(new Option("ミックス — すべての形から", MIX));
  if (![...presetSel.options].some(o => o.value === opt.preset)) opt.preset = "0";
  presetSel.value = opt.preset;
  const presetNote = () => { $("presetNote").textContent = opt.preset === MIX ? "花ごとに 10 種のプリセットから選んで揺らす。" : PRESETS[+opt.preset][2]; };
  presetSel.addEventListener("change", () => { opt.preset = presetSel.value; presetNote(); saveOpt(); regenerate(); });

  const styleSel = $("style");
  STYLES.forEach(([name], i) => styleSel.append(new Option(name, i)));
  styleSel.append(new Option("カスタム（下の 3 色）", ""));
  if (opt.style !== "" && !STYLES[+opt.style]) opt.style = "0";
  styleSel.value = opt.style;
  styleSel.addEventListener("change", () => { opt.style = styleSel.value; applyStyle(); saveOpt(); });
  for (const [id, k] of [["cBg", "bg"], ["c1", "c1"], ["c2", "c2"]])
    $(id).addEventListener("input", () => {
      if (opt.style !== "") { const st = style(); opt.bg = st.bg; opt.c1 = st.inks[0][0]; opt.c2 = st.inks[0][1]; }
      opt[k] = $(id).value; opt.style = ""; styleSel.value = ""; applyStyle(); saveOpt();
    });

  function seg(id, key, after = regenerate) {
    const btns = [...$(id).querySelectorAll("button")];
    const sync = () => btns.forEach(b => b.setAttribute("aria-pressed", +b.dataset.v === opt[key]));
    btns.forEach(b => b.addEventListener("click", () => { opt[key] = +b.dataset.v; sync(); saveOpt(); after(); }));
    sync();
  }
  seg("sizeSeg", "size"); seg("varySeg", "vary"); seg("autoSeg", "auto", () => {});

  $("settings").addEventListener("click", () => {
    const open = $("panel").hidden;
    $("panel").hidden = !open; $("settings").setAttribute("aria-expanded", open);
  });
  $("save").addEventListener("click", () => {
    frame.capture = () => {
      const a = document.createElement("a"); a.download = "flower-garden.png"; a.href = canvas.toDataURL("image/png"); a.click();
    };
  });
  // 花をタップするとその花だけ咲き直す（ダブルタップで 3D 版 ver.3 に開く）
  let lastTap = { f: null, t: 0 };
  canvas.addEventListener("click", e => {
    const x = e.clientX, y = e.clientY;
    let hit = null, best = Infinity;
    for (const f of flowers) { const d = Math.hypot(f.x - x, f.y - y) / f.r; if (d < 0.9 && d < best) { best = d; hit = f; } }
    wake();
    if (!$("panel").hidden) { $("panel").hidden = true; $("settings").setAttribute("aria-expanded", false); return; }
    if (!hit) return;
    const now = performance.now();
    if (lastTap.f === hit && now - lastTap.t < 350 && hit.q) {
      const q = hit.q, p = [q.n, q.lam, q.alpha, q.beta, q.gamma, q.omega, q.kap, q.mu, q.del, q.eps].map(v => +(+v).toFixed(4));
      location.href = `3d-v3.html?mode=flow&p=${p.join(",")}`;
      return;
    }
    lastTap = { f: hit, t: now };
    setTimeout(() => {
      if (lastTap.f !== hit || lastTap.t !== now) return;
      const i = flowers.indexOf(hit);
      if (i < 0) return;
      freeFlower(hit);
      const nf = newFlower(hit, false);
      nf.prio = 1; flowers[i] = nf; enqueue(nf);
    }, 360);
  });
  // 操作バーはしばらく触らないと消える
  let idleTimer = null;
  function wake() { $("bar").classList.remove("idle"); clearTimeout(idleTimer); idleTimer = setTimeout(() => { if ($("panel").hidden) $("bar").classList.add("idle"); else wake(); }, 4000); }
  for (const ev of ["pointermove", "pointerdown", "keydown"]) window.addEventListener(ev, wake, { passive: true });
  document.addEventListener("visibilitychange", () => { paused = document.hidden; last = performance.now(); });

  presetNote(); applyStyle();
  resize(); regenerate(); wake();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
